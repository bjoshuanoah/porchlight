<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F5F0" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- The boot mark is needed before the SPA bundle executes; preload the
         display-sized still at high priority rather than the 512px app icon. -->
    <link rel="preload" as="image" href="/icon-192.png" fetchpriority="high" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Porchlight · A place for family</title>
    <script>
      // PORCH-042 first-paint contract: the active mode resolves before the
      // first render pass — stored per-origin choice (porchlight:mode in
      // localStorage), System fallback follows prefers-color-scheme. The
      // background sets inline so dark never flashes warm-cream.
      (function () {
        var dark;
        try {
          var stored = localStorage.getItem("porchlight:mode");
          var mode = stored === "light" || stored === "dark" ? stored : "system";
          dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) { dark = false; }
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.backgroundColor = dark ? "#17120E" : "#F7F5F0";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#17120E" : "#F7F5F0");
      })();
    </script>
  </head>
  <body>
    <!-- The static dusk canvas paints before the SPA bundle; LanternBoot
         adopts it until readiness. -->
    <style>
      @keyframes porch95-fade { from { opacity: 1; } to { opacity: 0; } }
      /* Readiness dissolve: LanternBoot adds this class the moment the
         app's first surface is ready — never a timer. Keep the duration
         in step with BOOT_FADE_MS (src/loader-assets.js). */
      .porch95-boot-fade { animation: porch95-fade 250ms ease-out forwards; }
      /* Keep the same scene geometry on the pre-JS canvas and React fallback. */
      .porch-dusk-scene { position: relative; isolation: isolate; width: 300px; height: 340px; display: flex; align-items: center; justify-content: center; }
      .porch-dusk-mark { position: relative; z-index: 3; opacity: 0; display: block; transition: opacity 300ms ease-out; }
      .porch-dusk-mark-loaded { opacity: 1; }
      .porch-dusk-halo {
        position: absolute; left: 50%; top: 50%; width: 320px; height: 330px; z-index: 0;
        transform: translate(-50%, -50%); border-radius: 50%;
        background: radial-gradient(circle closest-side, rgba(255,190,87,.30) 0%, rgba(255,190,87,.12) 42%, rgba(255,190,87,0) 70%);
        animation: porch-dusk-breathe 4.8s ease-in-out infinite;
      }
      .porch-dusk-glow {
        position: absolute; left: 50%; top: 292px; width: 440px; height: 130px; z-index: 0;
        transform: translate(-50%, -50%) scaleY(.42); border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255,190,87,.26) 0%, rgba(255,190,87,.09) 55%, rgba(255,190,87,0) 78%);
        animation: porch-dusk-breathe 4.8s ease-in-out infinite; animation-delay: -2.4s;
      }
      @keyframes porch-dusk-breathe { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }
      .porch-dusk-particles { position: absolute; inset: 0; z-index: 0; }
      /* Brian, Oct 22, second amendment: count +300% (6 → 24 motes) and
         spread +200% (each mote's field extent ×3 — the widest orbit now
         sweeps 384px, 3× the prior 128px ceiling). The tiered radii keep
         near-lantern depth against the wide field, alternating direction
         stays, never a uniform swarm. The motes stay z-under the mark (it
         rides the top of the scene), so passing behind the lantern reads
         as the orbit wrapping it. Each load starts every mote at a
         random point of its orbit — the inline randomizer below offsets
         the animation into a per-load phase. */
      .porch-dusk-particle {
        position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; border-radius: 50%; opacity: .9;
        background: radial-gradient(circle at 40% 40%, #FFF6D8 0%, #FFE2B0 40%, #FFBE57 75%, rgba(255,190,87,0) 100%);
        box-shadow: 0 0 6px 2px rgba(255,226,176,.75), 0 0 18px 5px rgba(255,190,87,.28);
        animation: porch-dusk-orbit var(--d, 21s) ease-in-out infinite;
      }
      .porch-dusk-particle:nth-child(even) { animation-direction: reverse; }
      /* The elliptical orbit: four eased waypoints around the anchor with
         a gentle rotate wiggle — curved everywhere, never a straight run. */
      @keyframes porch-dusk-orbit {
        0%   { transform: translate(var(--r, 88px), 0) rotate(-90deg); }
        25%  { transform: translate(calc(var(--r, 88px) * .12), calc(var(--ry, 40px) * -1)) rotate(-180deg); }
        50%  { transform: translate(calc(var(--r, 88px) * -.92), calc(var(--ry, 40px) * -.12)) rotate(-270deg); }
        75%  { transform: translate(calc(var(--r, 88px) * -.06), var(--ry, 40px)) rotate(-360deg); }
        100% { transform: translate(var(--r, 88px), 0) rotate(-450deg); }
      }
      .porch-dusk-particle:nth-child(1) { --r: 264px; --ry: 114px; --d: 21s; animation-delay: -4s; }
      .porch-dusk-particle:nth-child(2) { --r: 336px; --ry: 156px; --d: 27s; animation-delay: -13s; }
      .porch-dusk-particle:nth-child(3) { --r: 222px; --ry: 90px;  --d: 18s; animation-delay: -9s; }
      .porch-dusk-particle:nth-child(4) { --r: 384px; --ry: 174px; --d: 30s; animation-delay: -2s; }
      .porch-dusk-particle:nth-child(5) { --r: 288px; --ry: 132px; --d: 23s; animation-delay: -17s; }
      .porch-dusk-particle:nth-child(6) { --r: 324px; --ry: 102px; --d: 26s; animation-delay: -21s; }
      .porch-dusk-particle:nth-child(7) { --r: 148px; --ry: 64px;  --d: 16s; animation-delay: -1s; }
      .porch-dusk-particle:nth-child(8) { --r: 232px; --ry: 96px;  --d: 22s; animation-delay: -11s; }
      .porch-dusk-particle:nth-child(9) { --r: 110px; --ry: 48px;  --d: 15s; animation-delay: -7s; }
      .porch-dusk-particle:nth-child(10) { --r: 300px; --ry: 128px; --d: 28s; animation-delay: -19s; }
      .porch-dusk-particle:nth-child(11) { --r: 186px; --ry: 78px;  --d: 19s; animation-delay: -3s; }
      .porch-dusk-particle:nth-child(12) { --r: 344px; --ry: 148px; --d: 29s; animation-delay: -25s; }
      .porch-dusk-particle:nth-child(13) { --r: 132px; --ry: 56px;  --d: 17s; animation-delay: -14s; }
      .porch-dusk-particle:nth-child(14) { --r: 258px; --ry: 108px; --d: 24s; animation-delay: -6s; }
      .porch-dusk-particle:nth-child(15) { --r: 96px;  --ry: 42px;  --d: 14s; animation-delay: -10s; }
      .porch-dusk-particle:nth-child(16) { --r: 312px; --ry: 136px; --d: 27s; animation-delay: -22s; }
      .porch-dusk-particle:nth-child(17) { --r: 210px; --ry: 88px;  --d: 20s; animation-delay: -15s; }
      .porch-dusk-particle:nth-child(18) { --r: 358px; --ry: 160px; --d: 31s; animation-delay: -8s; }
      .porch-dusk-particle:nth-child(19) { --r: 122px; --ry: 52px;  --d: 16s; animation-delay: -5s; }
      .porch-dusk-particle:nth-child(20) { --r: 274px; --ry: 120px; --d: 25s; animation-delay: -24s; }
      .porch-dusk-particle:nth-child(21) { --r: 170px; --ry: 72px;  --d: 18s; animation-delay: -12s; }
      .porch-dusk-particle:nth-child(22) { --r: 368px; --ry: 168px; --d: 32s; animation-delay: -18s; }
      .porch-dusk-particle:nth-child(23) { --r: 200px; --ry: 84px;  --d: 21s; animation-delay: -20s; }
      .porch-dusk-particle:nth-child(24) { --r: 288px; --ry: 118px; --d: 26s; animation-delay: -16s; }
      .porch95-statusbox { position: relative; height: 20px; width: 300px; }
      .porch95-status {
        position: absolute; left: 0; right: 0; top: 0; text-align: center; white-space: nowrap;
        opacity: 0; transition: opacity 250ms ease;
        color: var(--porch-boot-status-ink, #B3A48B); font-size: 14px;
        font-family: Inter, system-ui, sans-serif;
      }
      .porch95-status-on { opacity: 1; }
      .porch95-wordmark {
        color: var(--porch-boot-ink, #FCFAE8); font-size: 21px; font-weight: 650;
        letter-spacing: .02em; font-family: Inter, system-ui, sans-serif;
      }
      .porch95-announce {
        position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
      }
      .porch95-fail { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 2px; }
      .porch95-fail-copy {
        color: var(--porch-boot-ink, #FCFAE8); font-size: 15px; font-family: Inter, system-ui, sans-serif;
        text-align: center; max-width: 340px; line-height: 1.5;
      }
      .porch95-retry {
        appearance: none; background: transparent; border: 1px solid rgba(255,190,87,.65);
        border-radius: 999px; color: var(--porch-boot-ink, #FCFAE8); cursor: pointer;
        font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 600; padding: 9px 24px;
      }
      .porch95-retry:hover { background: rgba(255,190,87,.12); }
      /* PORCH-119 reduced motion ac-8: static lighting, no particles,
         instant status swaps. */
      @media (prefers-reduced-motion: reduce) {
        .porch-dusk-particle { display: none; }
        .porch-dusk-halo, .porch-dusk-glow { animation: none; opacity: .85; }
        .porch-dusk-mark, .porch95-status { transition: none; }
      }
    </style>
    <div id="porch-boot" role="status" style="position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--porch-boot-bg,#0B1622);z-index:2147483000;pointer-events:none;overflow:hidden">
      <span class="porch95-announce">Porchlight is loading</span>
      <div class="porch-dusk-scene" aria-hidden="true">
        <div class="porch-dusk-halo"></div>
        <div class="porch-dusk-glow"></div>
        <div class="porch-dusk-particles">
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
          <span class="porch-dusk-particle"></span>
        </div>
        <img class="porch-dusk-mark" src="/icon-192.png" fetchpriority="high" width="192" height="192" alt="" aria-hidden="true" focusable="false" style="height:184px;width:184px" />
      <script>
        // The icon may finish before this script runs (especially from cache).
        // Reveal only after its bytes are ready, never after a boot timer.
        (function (mark) {
          function reveal() {
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                if (mark.isConnected) mark.classList.add("porch-dusk-mark-loaded");
              });
            });
          }
          if (mark.complete && mark.naturalWidth) reveal();
          else mark.addEventListener("load", reveal, { once: true });
        })(document.currentScript.previousElementSibling);
      </script>
      <script>
        // Random starting points (Brian, Oct 22): every load opens each
        // mote at a random phase of its own orbit — the animation-delay
        // lands on a random fraction of the mote's duration, so no two
        // boots open on the same swarm. Count, spread, orbit geometry,
        // and reduced-motion hiding are untouched; the hardcoded delays
        // above remain only as the no-JS fallback phase.
        (function (motes) {
          for (var i = 0; i < motes.length; i++) {
            var duration = parseFloat(getComputedStyle(motes[i]).animationDuration);
            if (duration > 0) motes[i].style.animationDelay = "-" + (Math.random() * duration).toFixed(3) + "s";
          }
        })(document.querySelectorAll(".porch-dusk-particle"));
      </script>
      </div>
      <div class="porch95-wordmark" aria-hidden="true">porchlight</div>
      <div class="porch95-statusbox" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
