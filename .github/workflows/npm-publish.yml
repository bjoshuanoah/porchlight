name: npm-publish

# npm publish pipeline (PORCH-002 ac-2, PORCH-062): version → build → npm
# publish via OIDC trusted publishing → GitHub Release with signed artifacts.
# npm is the ONLY install surface (Brian, Oct 13, 2026 — brew/curl ruled out
# of V1); npm publish runs first, GitHub Releases are the signed supply-chain
# anchor of record per Distribution and Licensing (Porchlight Server TS 2).
# All steps run on GitHub-hosted runners only (Brian, Oct 8, 2026).
#
# Authentication is npm OIDC trusted publishing (PORCH-062 ac-1): the
# id-token: write permission lets npm exchange the GitHub OIDC token for a
# short-lived publish credential via the trusted-publisher binding on
# npmjs.com (github.com/bjoshuanoah/porchlight + workflow filename
# npm-publish.yml). Zero long-lived NPM_TOKEN exists in repository or CI
# secrets — do not reintroduce one. Provenance attestation is generated
# automatically under trusted publishing (no --provenance flag rides the
# publish: the flag belongs to the token-auth flow). setup-node runs @v6
# and the generated .npmrc's token placeholders are stripped: a dummy
# NODE_AUTH_TOKEN / authToken entry would make npm skip the OIDC exchange
# and fail with ENEEDAUTH (setup-node #1551, npm documentation #1960).
#
# Package coverage: `porchlight` always publishes (binding-covered package of
# record). The @porchlight/* scoped packages publish only when the registry
# already has them — npm OIDC trusted publishing requires the package to
# EXIST before its first OIDC publish plus a per-package trusted-publisher
# binding on npmjs.com, so a never-published scope cannot be created by this
# workflow; skipping is loud (::warning::) and the owner seeds those
# packages out-of-band (same one-time human step as porchlight's own
# registration, PORCH-062 trail).
#
# Triggers:
#   - push of a `v*` tag → full deploy (publish).
#   - workflow_dispatch with mode=dry-run → the identical flow minus the
#     npm publish (pack, Sigstore keyless signing, prerelease, cross-platform
#     tarball install, self-verification). Used to exercise the release path
#     without touching the registry.
#
# The version step sets every workspace (and the root) to the released
# version in the deploy working tree only; manifests on main are not
# rewritten by deploys. Released artifacts carry the version from the tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0, 0.1.0-dryrun.1)"
        required: true
        default: "0.1.0"
        type: string
      mode:
        description: "publish = real npm publish + stable release; dry-run = pack/sign/release without npm publish"
        required: false
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - publish

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm OIDC trusted publishing + Sigstore keyless signing

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: version → build → publish → signed release
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.env.outputs.mode }}
      tag: ${{ steps.env.outputs.tag }}
      version: ${{ steps.env.outputs.version }}
    env:
      # porchlight is the binding-covered package of record (trusted-publisher
      # binding: package porchlight → repo bjoshuanoah/porchlight → workflow
      # npm-publish.yml) and always publishes — its tarball is self-contained
      # (bundled runtime closure; see bundle-cli.mjs), so it publishes from
      # the release asset.
      #
      # @porchlight/* scoped package set: each publishes only if the registry
      # already has the package (npm OIDC trusted publishing cannot create a
      # first publish; the owner seeds it out-of-band per the PORCH-062
      # trail). @porchlight/web remains private.
      SCOPED: "@porchlight/shared @porchlight/identity @porchlight/social @porchlight/server"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - name: Clear token-auth placeholders (OIDC trusted publishing must not see a token)
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ] && grep -q "_authToken" "$npmrc"; then
            sed -i.bak '/_authToken/d' "$npmrc"
            rm -f "$npmrc.bak"
            echo "removed _authToken placeholder(s) from $npmrc"
          fi
      - uses: sigstore/cosign-installer@v3
      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@^11.5.1
          echo "npm $(npm --version) on node $(node --version)"
      - name: Resolve mode, version, tag
        id: env
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="${GITHUB_REF_NAME:?}"
            case "$TAG" in v*) ;; *) echo "::error::deploy tags must start with 'v' (got: $TAG)"; exit 1;; esac
            VERSION="${TAG#v}"
            MODE="publish"
          else
            VERSION="${{ inputs.version }}"
            MODE="${{ inputs.mode }}"
            TAG="v$VERSION"
            case "$VERSION" in v*) echo "::error::version must not carry the 'v' prefix (got: $VERSION)"; exit 1;; esac
          fi
          echo "TAG=$TAG"        >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MODE=$MODE"       >> "$GITHUB_ENV"
          echo "mode=$MODE"       >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying $TAG (mode: $MODE)"
        env:
          EVENT_NAME: ${{ github.event_name }}
      - name: npm ci
        run: npm ci
      - name: Version (all workspaces → $VERSION)
        run: node scripts/release/version.mjs "$VERSION"
      - name: Build
        run: npm run build
      - name: Pack release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for ws in $SCOPED; do
            npm pack -w "$ws" --pack-destination release-assets
          done
          # The porchlight tarball must be self-contained (bundleDependencies +
          # npm workspaces pack bug): build + verify it explicitly (PORCH-003).
          rm release-assets/porchlight-*.tgz
          node scripts/release/bundle-cli.mjs "$VERSION" --out release-assets
          (cd release-assets && shasum -a 256 -- *.tgz > SHA256SUMS)
          echo "Packed:" && ls -la release-assets
      - name: Sign SHA256SUMS (Sigstore keyless)
        run: |
          set -euo pipefail
          cd release-assets
          cosign sign-blob --yes --output-file /dev/null --bundle SHA256SUMS.bundle SHA256SUMS
      - name: Publish to npm (OIDC trusted publishing) — publish mode only
        if: env.MODE == 'publish'
        run: |
          set -euo pipefail
          # porchlight first, always: the binding covers this package and its
          # tarball is self-contained (registry needs nothing else for the
          # install path). Published version must equal the tag. The ./ spec
          # prefix is load-bearing: a bare relative path parses as a git
          # URL to npm, not a file. Provenance is automatic under trusted
          # publishing — no flag, and .npmrc must carry no authToken.
          npm publish "./release-assets/porchlight-$VERSION.tgz" --access public
          # Scoped packages only when the registry already has them — npm
          # requires a package to exist (plus its per-package trusted
          # publisher) before it can publish via OIDC, so a never-published
          # scope cannot be created here. Skipping is a loud warning, not a
          # silent pass.
          for ws in $SCOPED; do
            if npm view "$ws" version >/dev/null 2>&1; then
              npm publish --access public -w "$ws"
            else
              echo "::warning::$ws is not on registry.npmjs.org — npm OIDC trusted publishing requires the package to exist first (owner seeds it out-of-band, PORCH-062 trail) plus its trusted-publisher binding; $ws@$VERSION not published this cut."
            fi
          done
      - name: Release notes
        run: |
          set -euo pipefail
          {
            echo "# porchlight $TAG"
            if [ "$MODE" = "dry-run" ]; then
              echo ""
              echo "> ⚠️ DRY-RUN: npm publish was skipped (workflow_dispatch mode=dry-run). Artifacts below are the exact release set minus registry publication."
            fi
            echo ""
            echo "npm is the deploy and install surface: \`npm install -g porchlight\`."
            echo ""
            echo "## Changelog"
            echo ""
            CHANGELOG_SECTION=$(awk -v tag="$TAG" '$0 ~ ("^## " tag "( |$)") {flag=1; next} flag && /^## / {flag=0} flag {print}' CHANGELOG.md)
            if [ -z "$CHANGELOG_SECTION" ]; then
              echo "::error::CHANGELOG.md carries no entry under a '## $TAG' heading — every cut's changelog line rides its release notes (PORCH-062 ac-4)."
              exit 1
            fi
            echo "$CHANGELOG_SECTION"
            echo ""
            echo "## License"
            echo ""
            echo "MIT — https://github.com/bjoshuanoah/porchlight/blob/main/LICENSE (every published package ships MIT)."
            echo ""
            echo "## Verify"
            echo ""
            echo '```bash'
            echo "git clone --branch $TAG https://github.com/bjoshuanoah/porchlight.git && cd porchlight"
            echo "node scripts/release/verify-release.mjs --tag $TAG"
            echo '```'
            echo ""
            echo "Prerequisites and manual steps: docs/release-verification.md in this repo at $TAG."
            echo ""
            echo "## Assets"
            echo ""
            for f in release-assets/*.tgz; do echo "- $(basename "$f") — MIT, mirrors the npm-published tarball"; done
            echo "- SHA256SUMS — sha256 of every tarball"
            echo "- SHA256SUMS.bundle — Sigstore keyless signature of SHA256SUMS (identity pinned to npm-publish.yml)"
          } > release-notes.md
      - name: Create GitHub release
        run: |
          set -euo pipefail
          if [ "$MODE" = "dry-run" ]; then
            gh release create "$TAG" release-assets/* --prerelease --title "[dry-run] porchlight $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" release-assets/* --title "porchlight $TAG" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Self-verify — positive + loud negative
        run: |
          set -euo pipefail
          node scripts/release/verify-release.mjs --dir release-assets
          echo ""
          echo "=== negative fixture 1: unsigned (signature removed) ==="
          rm -rf neg-unsigned && mkdir -p neg-unsigned && cp release-assets/* neg-unsigned/ && rm neg-unsigned/SHA256SUMS.bundle
          if node scripts/release/verify-release.mjs --dir neg-unsigned >neg-unsigned.log 2>&1; then
            echo "::error::unsigned release assets PASSED verification — verification must fail loudly"
            cat neg-unsigned.log
            exit 1
          fi
          echo "OK — failed loudly as expected:"
          cat neg-unsigned.log
          echo ""
          echo "=== negative fixture 2: tampered tarball (checksum mismatch) ==="
          rm -rf neg-tamper && mkdir -p neg-tamper && cp release-assets/* neg-tamper/
          printf 'tampered' >> neg-tamper/$(ls neg-tamper | grep -v SHA256 | sed -n 1p)
          if node scripts/release/verify-release.mjs --dir neg-tamper >neg-tamper.log 2>&1; then
            echo "::error::tampered release assets PASSED verification — verification must fail loudly"
            cat neg-tamper.log
            exit 1
          fi
          echo "OK — failed loudly as expected:"
          cat neg-tamper.log
  verify-install:
    name: npm i -g porchlight + binary run (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MODE: ${{ needs.release.outputs.mode }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install globally + smoke run (binary runs from PATH, no further setup)
        run: |
          set -euo pipefail
          if [ "$MODE" = "dry-run" ]; then
            gh release download "$TAG" --pattern "porchlight-*.tgz" --dir "$RUNNER_TEMP/install" --repo "$GITHUB_REPOSITORY"
            npm install -g "$RUNNER_TEMP"/install/porchlight-*.tgz
          else
            # Registry propagation can lag the publish by minutes on a fresh
            # version (packager says "may take a few minutes"), and a mid-
            # propagation doc can install a closure-less tarball that
            # silently lacks the bin (run 38467646220: "added 1 package in
            # 904ms" → `porchlight: command not found`). The attempt only
            # counts when the BINARY ACTUALLY RUNS, not merely when install
            # exits 0.
            installed=""
            for attempt in 1 2 3 4 5 6; do
              if npm install -g porchlight && porchlight --version; then installed="1"; break; fi
              echo "attempt $attempt failed (install or binary run) — waiting 45s for registry propagation"
              sleep 45
            done
            if [ -z "$installed" ]; then
              echo "::error::npm install -g porchlight never produced a running porchlight binary from the registry"
              exit 1
            fi
          fi
          porchlight --version
          porchlight
          echo "OK: porchlight binary ran from PATH on ${{ matrix.os }}."
        env:
          GH_TOKEN: ${{ github.token }}